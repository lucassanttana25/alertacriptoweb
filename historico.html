<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert.</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            background-color: #111827;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">

        const API_URL = 'https://alertacriptoweb.onrender.com';

        function HistoryPage() {
            const [user, setUser] = React.useState(null);
            const [triggeredAlerts, setTriggeredAlerts] = React.useState([]);
            const [loading, setLoading] = React.useState(true);
            const token = localStorage.getItem('authToken');

            React.useEffect(() => {
                if (!token) {
                    // Se não houver token, redireciona para a página de login
                    window.location.href = '/index.html';
                    return;
                }

                const fetchHistoryData = async () => {
                    try {
                        const [userResponse, historyResponse] = await Promise.all([
                            fetch(`${API_URL}/users/me`, { headers: { 'Authorization': `Bearer ${token}` } }),
                            fetch(`${API_URL}/history/triggered-alerts`, { headers: { 'Authorization': `Bearer ${token}` } })
                        ]);

                        if (!userResponse.ok) throw new Error('Sessão inválida.');
                        const userData = await userResponse.json();
                        setUser(userData);

                        if (!historyResponse.ok) throw new Error('Não foi possível carregar o histórico.');
                        const historyData = await historyResponse.json();
                        setTriggeredAlerts(historyData);

                    } catch (error) {
                        console.error("Erro ao buscar dados:", error);
                        // Em caso de erro (ex: token expirado), volta para o login
                        localStorage.removeItem('authToken');
                        window.location.href = '/index.html';
                    } finally {
                        setLoading(false);
                    }
                };

                fetchHistoryData();
            }, [token]);

            if (loading) {
                return <div class="d-flex justify-content-center">
                    <div class="spinner-border" role="status">
                        <span class="sr-only">Carregando...</span>
                    </div>
                </div>
            }

            return (
                <div className="min-h-screen flex flex-col items-center p-4 sm:p-8">
                    <img src="/logo/alert-logo-etiqueta-menor.png" alt="Alert. Logo" className="w-48 mb-4" />

                    <div className="w-full max-w-4xl p-8 bg-[#1a202c] rounded-lg shadow-2xl border border-gray-700">
                        <div className="flex justify-between items-center mb-6">
                            <h2 className="text-3xl font-bold text-white">Histórico Alert.</h2>
                            <a href="/index.html" className="px-4 py-2 font-semibold text-black bg-yellow-400 rounded-md hover:bg-yellow-500">
                                Voltar ao Painel
                            </a>
                        </div>

                        {triggeredAlerts.length === 0 ? (
                            <p className="text-gray-400 text-center py-8">Ainda não há alertas disparados no seu histórico.</p>
                        ) : (
                            <div className="overflow-x-auto">
                                <table className="min-w-full">
                                    <thead className="border-b border-gray-700">
                                        <tr>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Data</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Ativo</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Tipo</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Preço Alvo</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-400 uppercase tracking-wider">Preço Atingido</th>
                                        </tr>
                                    </thead>
                                    <tbody className="divide-y divide-gray-800">
                                        {triggeredAlerts.map(alert => (
                                            <tr key={alert.id}>
                                                <td className="px-6 py-4 whitespace-nowrap text-gray-300">
                                                    {new Date(alert.data.timestamp).toLocaleString('pt-BR')}
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap font-medium text-white">{alert.data.ticker}</td>
                                                <td className="px-6 py-4 whitespace-nowrap text-gray-300 capitalize">{alert.data.tipo}</td>
                                                <td className="px-6 py-4 whitespace-nowrap text-gray-300">R$ {parseFloat(alert.data.preco_alvo).toFixed(2)}</td>
                                                <td className="px-6 py-4 whitespace-nowrap font-semibold text-yellow-400">R$ {parseFloat(alert.data.preco_atual).toFixed(2)}</td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const container = document.getElementById('root');
        const root = ReactDOM.createRoot(container);
        root.render(<HistoryPage />);

    </script>
</body>

</html>
